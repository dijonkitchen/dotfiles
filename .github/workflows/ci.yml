name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all shell scripts
        run: |
          shellcheck --severity=warning \
            bootstrap.sh \
            link-agents.sh \
            alias.sh \
            git.sh \
            settings.sh \
            homebrew.sh \
            python.sh \
            ruby.sh \
            .claude/statusline-command.sh

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          jq empty .claude/settings.json
